name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - if: matrix.os == 'ubuntu-latest'
        run: bun run test
      - name: Run tests on Windows except the Bun junction-removal regression
        if: matrix.os == 'windows-latest'
        run: >-
          bun test
          plugins/sol-advisor/mcp/server.test.ts
          plugins/sol-advisor/mcp/private-directory.test.ts
          tools/plugin-discovery.test.ts
          tools/orchestration-contract.test.ts
          tools/luna-explicit-contract.test.ts
          tools/version.test.ts
          --test-name-pattern
          '^(?!.*refuses traversal, symlink paths, and modified managed uninstall).*$'
      - run: bun run validate
      - if: matrix.os == 'ubuntu-latest'
        run: bun run release:check
